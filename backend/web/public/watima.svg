<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="Watima">
  <!-- The device itself: a dark disc, a lit ring, and the point of light at its
       centre. The same three shapes the hardware shows when it is listening, so
       the mark in a browser tab and the object in a child's hand read as one thing.

       The ring is a filled annulus rather than a stroked circle, deliberately.
       A stroke is the obvious way to draw it and renders correctly in browsers,
       but plenty of tooling - ImageMagick's built-in SVG renderer among them -
       silently drops strokes and exports a mark with no ring at all. Fills are
       handled everywhere, and the shape is identical. -->
  <circle cx="16" cy="16" r="16" fill="#0A0B0D"/>
  <path fill="#0F9D6E" fill-rule="evenodd"
        d="M3.5 16a12.5 12.5 0 1 0 25 0 12.5 12.5 0 1 0-25 0Z
           M6.5 16a9.5 9.5 0 1 0 19 0 9.5 9.5 0 1 0-19 0Z"/>
  <circle cx="16" cy="16" r="4.5" fill="#0F9D6E"/>
</svg>
